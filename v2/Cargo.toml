[package]
name = "mastodon-search-v2"
version = "2.0.0"
edition = "2021"
rust-version = "1.85"
license = "MIT"
publish = false

[dependencies]
tezbar-extension-sdk = { git = "https://github.com/almatkai/tezbar-extension-sdk-rust.git", rev = "e955911f0bf5b558f9d3eb5183df0adc95c22af2" }
serde_json = "=1.0.145"
tokio = { version = "=1.48.0", features = ["rt-multi-thread", "macros", "sync", "time", "net"] }
reqwest = { version = "=0.12.12", default-features = false, features = ["rustls-tls"] }
ryu-js = "=1.0.2"

[[bin]]
name = "mastodon-search"
path = "src/main.rs"

[profile.release]
lto = true
codegen-units = 1
strip = true
panic = "abort"
