[package]
name = "mastodon-owned-transport-helper"
version = "0.0.0"
edition = "2021"
rust-version = "1.85"
publish = false

[dependencies]
mastodon-search-v2 = { path = "../.." }
tezbar-extension-sdk = { git = "https://github.com/almatkai/tezbar-extension-sdk-rust.git", rev = "e955911f0bf5b558f9d3eb5183df0adc95c22af2" }
reqwest = { version = "=0.12.12", default-features = false, features = ["rustls-tls"] }
tokio = { version = "=1.48.0", features = ["rt-multi-thread","macros"] }
serde_json = "=1.0.145"
